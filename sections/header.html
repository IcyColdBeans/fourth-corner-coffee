<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="#main" aria-label="Fourth Corner Coffee, back to top" data-logo>
      <svg class="brand__mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
        <rect class="brand__outline" x="3" y="3" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" pathLength="1"/>
        <rect class="brand__corner" x="17" y="1.5" width="13.5" height="13.5"/>
      </svg>
      <span class="brand__word" aria-hidden="true">Fourth Corner</span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Sections">
      <a href="#today">Today</a>
      <a href="#menu">Menu</a>
      <a href="#quiz">Quiz</a>
      <a href="#punch">Rewards</a>
      <a href="#hold">Hold a drink</a>
      <a href="#visit">Visit</a>
    </nav>
    <span class="status-pill" data-open-status>Checking the clock…</span>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path class="nav-toggle__open" d="M4 7h16M4 12h16M4 17h16"/><path class="nav-toggle__close" d="M6 6l12 12M18 6L6 18"/></svg>
      <span>Sections</span>
    </button>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle light and dark">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>
      </svg>
    </button>
  </div>
</header>
