<section id="letters" class="section letters" aria-labelledby="letters-title">
  <div class="container">
    <p class="eyebrow">Reviews</p>
    <h2 id="letters-title" data-reveal>The mailbag runneth over.</h2>
    <p class="letters__note" data-reveal>These letters are fictional, like the shop. The coffee feelings are real.</p>

    <div class="letters__grid" data-reveal="stagger" role="region" aria-label="Letters to the editor, scroll sideways for more" tabindex="0">
      <figure class="letter">
        <blockquote><p>I walked past that corner for years and never once thought it needed anything. I was wrong. It needed a honey-oat latte and a chair facing the courthouse. I stand corrected, and then I sit.</p></blockquote>
        <figcaption>— A regular, table by the window</figcaption>
      </figure>
      <figure class="letter">
        <blockquote><p>A trumpet plays under my apartment every Saturday morning. I have stopped complaining and started ordering the mocha. Please tell the trombone, kindly, that the high notes are a little flat.</p></blockquote>
        <figcaption>— The very patient neighbor, upstairs</figcaption>
      </figure>
      <figure class="letter">
        <blockquote><p>My granddaughter took me in for a "cortado." I asked what that was. The young man said "the diplomat of the menu." I have ordered one every Tuesday since. Diplomacy is working.</p></blockquote>
        <figcaption>— Someone's grandpa, three sugars</figcaption>
      </figure>
      <figure class="letter">
        <blockquote><p>The cold brew steeps for eighteen hours. The woman at the counter learned my name in about four minutes. Only one of those numbers impressed me, and I'm not saying which.</p></blockquote>
        <figcaption>— A commuter, large cold brew, no room</figcaption>
      </figure>
      <figure class="letter">
        <blockquote><p>Mrs. Pruitt taught me clarinet a long time ago and told me to find my corner and hold it. I held one for two hours on Sunday with a Sugar Cream Bar. I believe that counts.</p></blockquote>
        <figcaption>— A former second clarinet, still second</figcaption>
      </figure>
    </div>
    <p class="letters__hint" aria-hidden="true">Swipe for more letters</p>

      <li><strong>1</strong> very patient neighbor</li>
      <li><strong>18</strong> hours of cold brew steeping</li>
    </ul>
  </div>
