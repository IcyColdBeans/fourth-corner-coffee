  <script>
    // Runs before paint so there is no theme flash. Mood follows the visitor's local clock;
    // a saved manual choice (fc.theme = "light" | "dark") overrides light/dark only.
    (function () {
      var h = new Date().getHours();
      var mood = h >= 5 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'midday' : h >= 17 && h < 21 ? 'evening' : 'night';
      var saved = null; try { saved = localStorage.getItem('fc.theme'); } catch (e) {}
      var d = document.documentElement;
      d.dataset.mood = mood;
      d.dataset.theme = saved || (mood === 'evening' || mood === 'night' ? 'dark' : 'light');
    })();
  </script>
